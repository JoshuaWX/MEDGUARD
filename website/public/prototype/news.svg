  <rect x="48" y="1202" width="704" height="122" rx="32" fill="#eff8f8"/><text x="76" y="1252" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="720" fill="#0b262b">Why attribution matters</text><text x="76" y="1290" font-family="Inter,Arial,sans-serif" font-size="17" fill="#60787d">MedGuard links health news back to its publisher.</text>
