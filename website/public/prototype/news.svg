  <defs><linearGradient id="newsField" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfb"/><stop offset="1" stop-color="#dff4f3"/></linearGradient><filter id="newsShadow"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#07383e" flood-opacity=".12"/></filter></defs><rect width="800" height="1440" rx="68" fill="url(#newsField)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="68" y="122" font-size="22" fill="#6e858a">←</text><text x="68" y="184" font-size="52" font-weight="760" fill="#0b262b">Health News</text><text x="68" y="222" font-size="21" fill="#61797e">Publisher, date and original link stay visible.</text></g>
  <g filter="url(#newsShadow)"><rect x="48" y="276" width="704" height="262" rx="36" fill="#0b5f6a"/><text x="84" y="336" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="760" letter-spacing="2" fill="#a7eced">OFFICIAL UPDATE</text><text x="84" y="394" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="740" fill="#fff">Read the original</text><text x="84" y="438" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="740" fill="#fff">source before acting.</text><rect x="84" y="472" width="212" height="38" rx="19" fill="#d8f5f5"/><text x="104" y="498" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750" fill="#0b5f6a">Awareness, not advice</text></g>
