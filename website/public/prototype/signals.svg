<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1440" viewBox="0 0 800 1440">
  <defs><linearGradient id="signalsField" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbfb"/><stop offset="1" stop-color="#dff4f0"/></linearGradient><filter id="signalsShadow"><feDropShadow dx="0" dy="16" stdDeviation="21" flood-color="#07383e" flood-opacity=".12"/></filter></defs><rect width="800" height="1440" rx="68" fill="url(#signalsField)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="68" y="120" font-size="20" font-weight="760" letter-spacing="2" fill="#70878b">MY HEALTH</text><text x="68" y="182" font-size="52" font-weight="760" fill="#0b262b">Health Signals</text><text x="68" y="220" font-size="21" fill="#60787d">Private to your test account.</text></g>
  <g filter="url(#signalsShadow)" font-family="Inter,Arial,sans-serif"><rect x="48" y="276" width="704" height="290" rx="42" fill="#fff"/><circle cx="190" cy="420" r="102" fill="none" stroke="#11a98b" stroke-width="25" stroke-dasharray="470 150" transform="rotate(-100 190 420)"/><text x="145" y="442" font-size="70" font-weight="760" fill="#0b262b">92</text><text x="355" y="360" font-size="18" font-weight="760" letter-spacing="2" fill="#72878c">WELLNESS SCORE</text><text x="355" y="425" font-size="43" font-weight="760" fill="#0b262b">Baseline</text><text x="355" y="470" font-size="20" fill="#60787d">Based on your chosen check-ins</text><text x="355" y="520" font-size="18" font-weight="720" fill="#087b8b">What this can’t tell you →</text></g>
  <g filter="url(#signalsShadow)" font-family="Inter,Arial,sans-serif"><rect x="48" y="614" width="704" height="280" rx="38" fill="#0b5f6a"/><text x="82" y="674" font-size="18" font-weight="760" letter-spacing="2" fill="#abeff0">DAILY CHECK-IN</text><text x="82" y="736" font-size="32" font-weight="750" fill="#fff">A private moment,</text><text x="82" y="778" font-size="32" font-weight="750" fill="#fff">not a diagnosis.</text><rect x="82" y="822" width="270" height="46" rx="23" fill="#fff"/><text x="112" y="853" font-size="18" font-weight="760" fill="#0b5f6a">Start a check-in</text></g>
  <g filter="url(#signalsShadow)" font-family="Inter,Arial,sans-serif"><rect x="48" y="942" width="704" height="238" rx="36" fill="#fff"/><text x="80" y="1002" font-size="18" font-weight="760" letter-spacing="2" fill="#70878b">YOUR INFORMATION</text><text x="80" y="1060" font-size="30" font-weight="750" fill="#0b262b">You choose what to record.</text><text x="80" y="1102" font-size="19" fill="#60787d">No health conversation is stored on this device.</text><text x="80" y="1146" font-size="18" font-weight="720" fill="#087b8b">Manage My Health →</text></g>
  <text x="74" y="1254" font-family="Inter,Arial,sans-serif" font-size="18" fill="#667e83">For persistent or worsening symptoms, seek medical care.</text>
</svg>
