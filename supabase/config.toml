project_id = "cddfhyxlhtmrrtduwlqd"

[auth]
site_url = "medguard://signin"
additional_redirect_urls = [
  "medguard://signin",
  "medguard://auth/callback",
  "medguard://google-auth",
]

[functions.chat]
verify_jwt = true

[functions.intel]
verify_jwt = true

[functions.avatar-sign]
verify_jwt = true

[functions.verify-location]
# Signup verification is intentionally unauthenticated; authenticated calls are
# validated in the function before the owner-scoped RPC is used.
verify_jwt = false

[functions.nearby-facilities]
# Guest users can search for nearby care. The function has bounded inputs and
# rate limiting, and uses an optional JWT only to improve rate-limit identity.
verify_jwt = false

[functions.app-version]
verify_jwt = false

# Called by the scheduler (pg_cron), guarded by NOTIFY_CRON_SECRET, not a user JWT.
[functions.notify-area]
verify_jwt = false

# Machine-to-machine functions authenticate with a required shared secret.
[functions.dispatch-sms-alerts]
verify_jwt = false

[functions.dispatch-health-posts]
verify_jwt = false

[functions.dispatch-risk-changes]
verify_jwt = false

# Africa's Talking callbacks have no Supabase JWT. The function validates a
# required callback secret in the provider-configured URL instead.
[functions.ussd]
verify_jwt = false
