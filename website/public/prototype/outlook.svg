<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1440" viewBox="0 0 800 1440">
  <defs><linearGradient id="outlookField" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fafb"/><stop offset="1" stop-color="#e4f3f6"/></linearGradient><filter id="outlookShadow"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#07383e" flood-opacity=".11"/></filter></defs><rect width="800" height="1440" rx="68" fill="url(#outlookField)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="68" y="118" font-size="22" fill="#5a767b">←</text><text x="68" y="182" font-size="50" font-weight="760" fill="#0b262b">Area outlook</text><text x="68" y="220" font-size="21" fill="#61797e">A projection is never confirmation.</text></g>
  <g filter="url(#outlookShadow)" font-family="Inter,Arial,sans-serif"><rect x="48" y="276" width="704" height="510" rx="40" fill="#fff"/><path d="M96 610c78-112 166-110 240-14 82 106 165 85 263-93" fill="none" stroke="#a6dcdf" stroke-width="10" stroke-linecap="round"/><path d="M96 653c78-112 166-110 240-14 82 106 165 85 263-93" fill="none" stroke="#0b8b99" stroke-width="4" stroke-linecap="round"/><rect x="84" y="316" width="162" height="38" rx="19" fill="#e5f7f7"/><text x="106" y="342" font-size="16" font-weight="760" fill="#087b8b">MODELLED OUTLOOK</text><text x="84" y="420" font-size="38" font-weight="760" fill="#0b262b">Example area signal</text><text x="84" y="462" font-size="21" fill="#60787d">State-matched projection</text><rect x="84" y="696" width="566" height="1" fill="#dcebed"/><text x="84" y="738" font-size="17" font-weight="760" fill="#6a8388">SOURCE</text><text x="224" y="738" font-size="17" fill="#0b262b">Forecast model · generated date</text></g>
  <g font-family="Inter,Arial,sans-serif"><text x="68" y="862" font-size="18" font-weight="760" letter-spacing="2" fill="#718a8f">WHAT THIS MEANS</text></g><g filter="url(#outlookShadow)" font-family="Inter,Arial,sans-serif"><rect x="48" y="896" width="704" height="258" rx="34" fill="#0a6875"/><text x="82" y="956" font-size="18" font-weight="760" letter-spacing="2" fill="#a8edef">CONFIDENCE AND VALIDITY</text><text x="82" y="1024" font-size="31" font-weight="750" fill="#fff">Show the limit with</text><text x="82" y="1063" font-size="31" font-weight="750" fill="#fff">the signal.</text><text x="82" y="1112" font-size="19" fill="#d2eff1">This outlook is awareness information—not a diagnosis or outbreak confirmation.</text></g>
  <rect x="48" y="1196" width="704" height="110" rx="30" fill="#fff"/><text x="78" y="1240" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="760" fill="#0b262b">Environmental context stays separate</text><text x="78" y="1279" font-family="Inter,Arial,sans-serif" font-size="17" fill="#60787d">Weather alone does not create a disease alert.</text>
</svg>
